name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/inspeksi-kubikel-beyond-kwh

permissions:
  contents: read

jobs:
  php-and-storage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: gd, intl, mbstring, mysqli, zip
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint application PHP files
        shell: bash
        run: |
          set -euo pipefail
          find app -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l

      - name: Run storage and staging security regressions
        shell: bash
        run: |
          set -euo pipefail
          # Only run when test files are present (they live on feature branches, not on main itself)
          if [ -f tests/unit/StoragePathResolutionTest.php ]; then
            php vendor/bin/phpunit --no-coverage --testdox --fail-on-skipped \
              tests/unit/StoragePathResolutionTest.php \
              tests/unit/StoragePathIsolationRuntimeTest.php \
              tests/unit/DatabaseEnvironmentConfigurationTest.php \
              tests/unit/PublicExposureHardeningTest.php
          else
            echo "Test files not present in this branch — skipping security regression suite."
          fi

      - name: Run staging preflight tests
        shell: bash
        run: |
          set -euo pipefail
          # Only run when staging scripts are present (they live on feature branches)
          if [ -f tests/scripts/deploy_staging_preflight_test.sh ]; then
            bash tests/scripts/deploy_staging_preflight_test.sh
          else
            echo "Staging preflight test script not present — skipping."
          fi

      - name: Check staging release deploy script syntax
        shell: bash
        run: |
          set -euo pipefail
          # Only run when deploy scripts are present (they live on feature branches)
          if [ -f scripts/deploy_staging_release.sh ]; then
            bash -n scripts/deploy_staging_release.sh
          fi
          if [ -f tests/scripts/deploy_staging_preflight_test.sh ]; then
            bash -n tests/scripts/deploy_staging_preflight_test.sh
          fi
          if [ ! -f scripts/deploy_staging_release.sh ] && [ ! -f tests/scripts/deploy_staging_preflight_test.sh ]; then
            echo "Deploy scripts not present in this branch — skipping syntax check."
          fi

      - name: Check committed diff whitespace
        shell: bash
        run: |
          set -euo pipefail
          # Only meaningful when there are commits beyond origin/main (e.g. feature branches)
          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            if ! git merge-base --is-ancestor HEAD origin/main 2>/dev/null; then
              git diff --check origin/main...HEAD
            else
              echo "HEAD is already in origin/main — whitespace check skipped."
            fi
          else
            echo "origin/main not available — whitespace check skipped."
          fi
