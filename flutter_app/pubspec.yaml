name: sidak_tejo_flutter
description: "SIDAK TEJO Enterprise Flutter Native Offline-First Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Networking & HTTP
  dio: ^5.4.0
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^5.0.2

  # Encrypted Local Database & Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2

  # Biometrics & Security
  local_auth: ^2.1.8

  # Native Camera & Media
  camera: ^0.10.5+9
  image: ^4.1.7

  # Native GPS & Geofencing
  geolocator: ^10.1.0

  # Maps & Offline Tile Cache
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # Firebase Messaging & Analytics
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10
  firebase_crashlytics: ^3.4.9
  firebase_analytics: ^10.7.4

  # UI Design System (Material 3)
  google_fonts: ^6.1.0
  flutter_spinkit: ^5.2.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
