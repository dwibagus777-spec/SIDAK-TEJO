<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- CO BRANCH (Cut Out Branch): Vertical rectangular switch element with leads -->
  <!-- Top and Bottom Wire Leads -->
  <line x1="24" y1="2" x2="24" y2="12" stroke="#111827" stroke-width="3" stroke-linecap="round" />
  <line x1="24" y1="36" x2="24" y2="46" stroke="#111827" stroke-width="3" stroke-linecap="round" />
  <!-- Central Switch Box -->
  <rect x="14" y="12" width="20" height="24" fill="#ffffff" stroke="#111827" stroke-width="2.5" />
  <!-- Diagonal Lower Triangle Fill -->
  <polygon points="14,12 34,36 14,36" fill="#111827" />
  <!-- Diagonal Slash -->
  <line x1="14" y1="12" x2="34" y2="36" stroke="#111827" stroke-width="2" />
</svg>
