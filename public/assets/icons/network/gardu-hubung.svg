<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- GH (Gardu Hubung): Orange 3D beveled box with chain/link center -->
  <!-- Outer Bevel Base -->
  <polygon points="4,4 44,4 40,8 8,8" fill="#fdba74" />
  <polygon points="44,4 44,44 40,40 40,8" fill="#c2410c" />
  <polygon points="44,44 4,44 8,40 40,40" fill="#9a3412" />
  <polygon points="4,44 4,4 8,8 8,40" fill="#fb923c" />
  <!-- Main Face -->
  <rect x="8" y="8" width="32" height="32" fill="#ea580c" stroke="#c2410c" stroke-width="1.5" />
  <!-- Chain / Link Symbol in Center -->
  <ellipse cx="19" cy="24" rx="6" ry="3.5" fill="none" stroke="#93c5fd" stroke-width="2.5" />
  <ellipse cx="29" cy="24" rx="6" ry="3.5" fill="none" stroke="#60a5fa" stroke-width="2.5" />
</svg>
